<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Required Foods</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            position: relative; /* Added to ensure absolute positioning works */
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        a {
            text-decoration: none;
            color: #007bff;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #0056b3;
        }
        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .button-container img {
            width: 50px;
            height: auto;
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .button-container img:hover {
            transform: scale(1.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .action-buttons {
            text-align: center;
        }
        .action-buttons img {
            width: 25px;
            margin: 0 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .action-buttons img:hover {
            transform: scale(1.1);
        }
        .main-menu-button {
            display: inline-block;
            padding: 5px 10px;
            background-color: #28a745; /* Green background */
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .main-menu-button:hover {
            background-color: #218838; /* Darker green on hover */
        }
    </style>
</head>
<body>

<a href="/MyFoods" class="main-menu-button">Go to main menu</a>

<h2>This list represents the minimum food stock of our house</h2>

<div class="button-container">
    <a href="/required-foods/create"><img src="/add-button.png" alt="Add Food"></a>
    <a href="/required-foods/delete-all"><img src="/delete.png" alt="Delete All"></a>
</div>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Loop through the list of foods and display them -->
    <tr th:each="food : ${listOfFoods}">
        <td th:text="${food.name}"></td>
        <td th:text="${food.quantity}"></td>
        <td class="action-buttons">
            <a th:href="@{/required-foods/edit/{id}(id=${food.id})}">
                <img src="/edit-button.png" alt="Edit">
            </a>
            <a th:href="@{/required-foods/delete/{id}(id=${food.id})}">
                <img src="/delete-button.png" alt="Delete">
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
