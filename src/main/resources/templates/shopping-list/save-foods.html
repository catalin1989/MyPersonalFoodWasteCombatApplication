<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Foods in Closet</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #e0f7fa; /* Light cyan background color */
            margin: 0;
            padding: 20px;
            position: relative; /* For positioning the main menu button */
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .action-buttons {
            text-align: center;
        }
        .action-buttons img {
            width: 25px;
            margin: 0 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .action-buttons img:hover {
            transform: scale(1.1);
        }
        .main-menu-link {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #28a745; /* Green background color */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .main-menu-link:hover {
            background-color: #218838; /* Darker green for hover effect */
        }
    </style>
</head>
<body>

<a href="/MyFoods" class="main-menu-link">Go to Main Menu</a>

<h1>Bought Foods</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Loop through the list of foods and display them -->
    <tr th:each="food : ${foods}">
        <td th:text="${food.name}"></td>
        <td th:text="${food.quantity}"></td>
        <td class="action-buttons">
            <a th:href="@{/closet/foods/edit/{id}(id=${food.id})}">
                <img src="/edit-button.png" alt="Edit">
            </a>
            <a th:href="@{/closet/foods/delete/{id}(id=${food.id})}">
                <img src="/delete-button.png" alt="Delete">
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
