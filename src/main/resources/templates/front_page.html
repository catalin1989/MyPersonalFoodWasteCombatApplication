<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Waste Combat App</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #e0f7fa; /* Light cyan background color */
            margin: 0;
            padding: 20px;
        }
        .logout-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .logout-button {
            padding: 10px 20px;
            background-color: #ff4c4c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
        .logout-button:hover {
            background-color: #ff1a1a;
        }
        h1, h2, h3 {
            color: #333;
            text-align: center;
        }
        .link-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .link-container a {
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .link-container a:hover {
            background-color: #0056b3;
        }
        .icon-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .icon-container img {
            width: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .icon-container img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="logout-container">
    <a href="/logout" class="logout-button">Logout</a>
</div>

<h1>Welcome to My Personal Food Waste Combat Application</h1>

<h2>Places where you can store food</h2>
<div class="link-container">
    <a href="closet">Closet</a>
    <a href="freezer">Freezer</a>
    <a href="refrigerator">Refrigerator</a>
</div>

<h3>Click the icon to search for food</h3>
<div class="icon-container">
    <a href="search-for-food"><img src="/Search_Icon.png" alt="Search"></a>
    <a href="/required-foods"><img src="/foods.png" alt="Required Foods"></a>
    <a href="/shopping-list"><img src="/shopping-cart.png" alt="Shopping List"></a>
</div>

</body>
</html>
