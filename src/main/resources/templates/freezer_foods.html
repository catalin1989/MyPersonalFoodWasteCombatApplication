<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Foods in Freezer</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #e0f7fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    a {
      text-decoration: none;
      color: #007bff;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #0056b3;
    }
    .back-button {
      display: inline-block;
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
      transition: background-color 0.3s ease;
    }
    .back-button:hover {
      background-color: #218838;
    }
    .add-button-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .add-button-container img {
      width: 50px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .add-button-container img:hover {
      transform: scale(1.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
      text-align: center;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .action-buttons {
      text-align: center;
    }
    .action-buttons img {
      width: 25px;
      margin: 0 5px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .action-buttons img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
<h1>All Foods in Freezer</h1>
<a href="/freezer" class="back-button">Go back</a>
<div class="add-button-container">
  <a href="/freezer/foods/create"><img src="/add-button.png" alt="Add Food"></a>
</div>
<table>
  <thead>
  <tr>
    <th>Name</th>
    <th>Quantity</th>
    <th>Unit Measurement</th>
    <th>Expiration Date</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <!-- Loop through the list of foods and display them -->
  <tr th:each="food : ${foods}">
    <td th:text="${food.name}"></td>
    <td th:text="${food.quantity}"></td>
    <td th:text="${food.getUnitMeasurement()}"></td>
    <td th:text="${food.expirationDate}"></td>
    <td class="action-buttons">
      <a th:href="@{/freezer/foods/edit/{id}(id=${food.id})}">
        <img src="/edit-button.png" alt="Edit">
      </a>
      <a th:href="@{/freezer/foods/delete/{id}(id=${food.id})}">
        <img src="/delete-button.png" alt="Delete">
      </a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
